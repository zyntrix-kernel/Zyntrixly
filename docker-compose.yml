version: '3.8'

services:
  zyntrixly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zyntrixly_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
