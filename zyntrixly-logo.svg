<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="zl-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="zl-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="zl-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <!-- Background Obsidian Hexagon / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#121215" stroke="url(#zl-rim)" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#09090b" fill-opacity="0.7"/>
  
  <!-- Precision Faceted Monogram Z -->
  <!-- Top Bar -->
  <path d="M19 20h26c1.1 0 1.8 1.1 1.3 2.1l-4.2 7.4c-.3.5-.8.8-1.4.8H21c-1.1 0-1.8-1.1-1.3-2.1l2.4-7.4c.2-.5.5-.8 1-.8z" fill="url(#zl-mono)"/>
  
  <!-- Diagonal Beam -->
  <polygon points="39.5,23 20.5,41 24.5,41 43.5,23" fill="url(#zl-accent)" opacity="0.95"/>
  
  <!-- Bottom Bar -->
  <path d="M23 44h26c1.1 0 1.8-1.1 1.3-2.1l-2.4-7.4c-.2-.5-.5-.8-1-.8H23.5c-.6 0-1.1.3-1.4.8l-4.2 7.4c-.5 1 .2 2.1 1.3 2.1z" fill="url(#zl-mono)"/>
  
